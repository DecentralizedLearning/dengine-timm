[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengine-timm"
version = "0.1.0"
description = "dEngine extension for timm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dengine",
    "timm",
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
include = ["dengine_uciml*"]

[tool.setuptools.data-files]
"share/dengine-timm/configs" = [
  "configs/*.*",
  "configs/**/*.*"
]
